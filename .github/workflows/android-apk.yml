name: Android APK

# Gera um APK instalável para testes (assinado com a chave de debug do Flutter; NÃO é para a Play Store).
# Baixe o arquivo em: Actions → esta execução → Artifacts → finance-hub-apk.
on:
  workflow_dispatch:
  push:
    branches: [claude/finance-hub-local-first-hnshr2, main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Dependências
        run: |
          sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev
          flutter pub get

      - name: Análise e testes
        run: |
          flutter analyze
          flutter test

      - name: Build do APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: finance-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
